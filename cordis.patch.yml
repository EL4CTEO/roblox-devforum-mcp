# DeepSeek Harness bundle patch: run this MCP server inside a live Harness.
#
# dsh already speaks MCP through @deepseek-ai/dsh-mcp-client, so this file only has to say
# how to start the server. Tools land in the registry as mcp__roblox-devforum__<tool>.
#
# Install from npm, not from git: the npm package ships a prebuilt native binary, while a git
# install would have to compile the Rust sources inside the profile.
#
#   dsh plugin --profile web add roblox-devforum-mcp
#   dsh --profile web
- insert:
    - id: roblox-devforum
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: roblox-devforum
        transport: stdio
        command: npx
        args: ['-y', 'roblox-devforum-mcp']
