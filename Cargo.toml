[package]
name = "roblox-devforum-mcp"
version = "1.4.0"
edition = "2024"
rust-version = "1.99"
description = "MCP server that searches the Roblox DevForum and official creator docs so AI coding agents can debug Roblox games against real community and engine knowledge."
license = "MIT"
authors = ["EL4CTEO"]
repository = "https://github.com/EL4CTEO/roblox-devforum-mcp"
homepage = "https://github.com/EL4CTEO/roblox-devforum-mcp#readme"
readme = "README.md"
keywords = ["mcp", "roblox", "devforum", "luau", "ai"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["assets/", ".github/", "docs/"]

[[bin]]
name = "roblox-devforum-mcp"
path = "src/main.rs"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
memchr = "2.8"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "fs"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
